name: Validate and build
on:
  push:
    paths: ['Sources/**', 'scripts/build.sh', 'scripts/package.sh', 'tests/**', '.github/workflows/check.yml']
  pull_request:
    paths: ['Sources/**', 'scripts/build.sh', 'scripts/package.sh', 'tests/**', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node tests/generator-quality.cjs
      - run: node tests/worker-stress.cjs
  universal-mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n install.sh scripts/build.sh scripts/package.sh
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GroundSurf-preview
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
